version: '3.8'  # 建议添加版本号（可选，但更规范）
services:
  mysql:
    image: mysql:8.0.32
    container_name: mysql-dev
    environment:
      MYSQL_DATABASE: ry-vue
      MYSQL_USER: ry-vue
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql  # 引用top-level的volumes
    networks:
      - devnet  # 若使用自定义网络，需确保top-level有networks定义（可选）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0 # 解决MySQL 8+的认证问题

# Top-level volumes定义（与services同级）
volumes:  # 这里必须用冒号！
  mysql-data:  # 声明一个名为mysql-data的持久化卷（自动创建）

networks:
  devnet:
    external: true  # 使用已创建的 devnet 网络


