services:
  redis:
    image: redis:7.0.8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - devnet
    healthcheck:  # 添加健康检查
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes  # 启用AOF持久化

volumes:
  redis-data:  # 新增Redis数据卷

networks:
  devnet:
    external: true  # 使用已创建的 devnet 网络